<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기획노트 뷰어</title>
<link rel="stylesheet" href="note.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; background: #fff; }
  #pv { flex: 1 1 auto; min-width: 0; height: 100%; border: 0; display: block; background: #fff; }
  #dock { position: relative; flex: 0 0 auto; width: var(--w, 400px); height: 100%; display: flex; flex-direction: column; background: var(--bg); border-left: 1px solid var(--line); }
  body:not(.open) #dock { display: none; }
  #grip { position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 3; }
  #grip:hover, body.drag #grip { background: linear-gradient(90deg, transparent 3px, var(--pt) 3px, var(--pt) 5px, transparent 5px); }
  body.drag #pv { pointer-events: none; }
  .dh { padding: 12px 14px 10px; background: #fff; border-bottom: 1px solid var(--line); }
  .dh .r { display: flex; align-items: center; gap: 8px; }
  .dh .t { font-size: 14px; font-weight: 700; }
  .dh .t::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 2px; background: var(--pt); }
  .dh .sp { flex: 1; }
  .dh .x { width: 28px; height: 28px; border: 0; border-radius: var(--r); background: none; font-size: 18px; color: var(--mut); }
  .dh .x:hover { background: var(--hover); color: var(--tx); }
  .cur { margin-top: 6px; font-size: 12.5px; color: var(--sub); }
  .cur b { color: var(--tx); }
  .cur code { font-size: 11px; }
  .cur .pop { display: inline-flex; margin-left: 6px; padding: 0 6px; border-radius: 3px; background: var(--pt-bg); color: var(--pt-d); font-size: 11px; font-weight: 600; }
  .tabs { display: flex; gap: 2px; padding: 0 10px; background: #fff; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; height: 38px; border: 0; border-bottom: 2px solid transparent; background: none; font-size: 12.5px; color: var(--sub); white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--tx); font-weight: 700; border-bottom-color: var(--pt); }
  .tabs button em { font-style: normal; font-size: 11px; color: var(--mut); margin-left: 3px; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 11.5px; color: var(--mut); }
  .bar .sp { flex: 1; }
  .lg { display: inline-flex; align-items: center; gap: 4px; }
  .lg i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #list { flex: 1; overflow-y: auto; padding: 0 12px 16px; }
  .it { position: relative; padding: 10px 12px 10px 38px; margin-bottom: 8px; background: #fff; border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); }
  .it.act { border-color: var(--pt); box-shadow: 0 0 0 1px var(--pt); }
  .it .no { position: absolute; left: 10px; top: 11px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; color: #fff; font: 700 11px/20px var(--f); text-align: center; }
  .it .r1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .it .tl { font-weight: 700; font-size: 13px; }
  .it .sm2 { margin: 4px 0 0; color: var(--sub); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .it .ac { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .it .nc { font-size: 11.5px; color: var(--mut); }
  .it.off { opacity: .55; }
  .it.off .why { display: block; }
  .it .why { display: none; margin-top: 6px; font-size: 11.5px; color: var(--tbd); font-weight: 600; }
  .empty { padding: 28px 10px; text-align: center; color: var(--mut); }
  .df { padding: 8px 14px; border-top: 1px solid var(--line); background: #fff; font-size: 11.5px; color: var(--mut); display: flex; gap: 10px; }
  .df .sp { flex: 1; }
  #fab { position: fixed; right: 18px; bottom: 18px; z-index: 5; display: none; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: var(--tx); color: #fff; font-size: 13px; font-weight: 700; box-shadow: 0 6px 18px rgba(16, 24, 40, .25); }
  #fab b { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--pt); font-size: 11px; }
  body:not(.open) #fab { display: inline-flex; }
  .err { margin: 14px 12px; padding: 12px; border: 1px solid #f3c7c7; border-left: 3px solid var(--tbd); border-radius: var(--r); background: #fff; color: var(--sub); font-size: 12.5px; }
  .err b { color: var(--tbd); }
  .err code { font-size: 11.5px; }
</style>
</head>
<body class="open">
<iframe id="pv" title="공급사Portal 프로토타입"></iframe>
<aside id="dock" aria-label="기획 노트 패널">
  <div id="grip" role="separator" aria-orientation="vertical" aria-label="패널 폭 조절" tabindex="0"></div>
  <div class="dh">
    <div class="r"><span class="t">기획 노트</span><span class="sp"></span>
      <button type="button" class="b sm" id="chip" aria-pressed="false" title="이 탭 항목의 위치를 번호 칩으로 모두 표시">칩 표시</button>
      <button type="button" class="x" id="close" aria-label="패널 닫기" title="패널 닫기">×</button></div>
    <div class="cur" id="cur">프로토타입 불러오는 중…</div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="bar"><span class="lg"><i style="background:#109EBE"></i>확정</span><span class="lg"><i style="background:#D97706"></i>협의</span><span class="lg"><i style="background:#DC2626"></i>TBD · 이슈</span><span class="lg"><i style="background:#7C3AED"></i>보류</span><span class="sp"></span></div>
  <div id="list" role="tabpanel"></div>
  <div class="df"><a href="index.html" target="_blank" rel="noopener">기획노트 전체 ↗</a><span class="sp"></span><span id="bst"></span></div>
</aside>
<button type="button" id="fab" aria-label="기획 노트 패널 열기">기획 노트 <b id="fabn">0</b></button>

<script src="data/meta.js"></script>
<script src="data/proto-menu.js"></script>
<script src="data/policy.js"></script>
<script src="data/screen.js"></script>
<script src="data/req.js"></script>
<script src="data/scenario.js"></script>
<script src="data/process.js"></script>
<script src="data/history.js"></script>
<script src="core.js"></script>
<script src="bridge.js"></script>
<script>
(function (N) {
  "use strict";
  const $ = (s) => document.querySelector(s), esc = N.esc;
  const qs = new URLSearchParams(location.search);
  const V = { tab: "scr", act: null, chip: false, cur: null, items: [], ctx: null, deep: { scr: qs.get("scr"), hl: qs.get("hl") }, err: null };
  const W0 = Math.min(520, Math.max(360, +N.store.get("vw", 400) || 400));
  document.body.style.setProperty("--w", W0 + "px");
  if (N.store.get("vopen", true) === false && !V.deep.hl) document.body.classList.remove("open");

  const TONE = { "확정": "#109EBE", "협의": "#D97706", "보류": "#7C3AED", "TBD": "#DC2626", "삭제": "#8A8F98" };
  const tone = (it) => TONE[it.status] || TONE["확정"];

  /* 현재 화면 항목 · 탭 */
  function lists() {
    const C = V.ctx ? V.ctx.cur : null, A = C ? N.forScreen(C) : [];
    const T = {}; N.VTABS.forEach((t) => (T[t.k] = A.filter((x) => t.types.includes(x.type)).sort((a, b) => a.id.localeCompare(b.id, "ko", { numeric: true }))));
    return { A, T };
  }
  /* 항목의 이 화면 앵커 해석 */
  function anchorState(it) {
    const C = V.ctx && V.ctx.cur, A = (it.anchor || []).filter((a) => a.scr === C);
    if (!A.length) return { n: 0, ok: 0, why: "이 화면 위치 없음" };
    const R = A.map((a) => br.resolve(a)), ok = R.filter((r) => r.el).length;
    return { n: A.length, ok, why: ok ? "" : R.map((r) => r.why).filter((v, i, a) => v && a.indexOf(v) === i).join(" · ") };
  }
  function hlList(it, n) { const C = V.ctx.cur; return (it.anchor || []).filter((a) => a.scr === C).map((a) => ({ anchor: a, n, tone: tone(it) })); }

  function head() {
    const c = V.ctx;
    if (V.err) { $("#cur").innerHTML = "연결 안 됨"; return; }
    if (!c) return;
    $("#cur").innerHTML = c.auth ? "<b>로그인 화면</b> — 메뉴 화면이 아님" :
      `<b>${esc(c.lb)}</b> <code>${esc(c.cur)}</code>${c.tab && c.cur !== "home" ? ` <span class="mut">· ${esc(c.tab)}${c.sec && c.sec !== c.tab ? " › " + esc(c.sec) : ""}</span>` : ""}${c.popup ? `<span class="pop" title="${esc(c.popupTitle)}">팝업 열림</span>` : ""}`;
  }
  function tabs(T) {
    $("#tabs").innerHTML = N.VTABS.map((t) => `<button type="button" role="tab" data-tab="${t.k}" aria-selected="${V.tab === t.k}">${t.lb}<em>${T[t.k].length}</em></button>`).join("");
  }
  function item(it, i) {
    const ok = br.okFor(it), s = anchorState(it), act = V.act === it.id;
    const loc = s.ok ? `<button type="button" class="b sm${act ? " on" : ""}" data-loc="${esc(it.id)}" aria-pressed="${act}">위치 보기${s.n > 1 ? ` ${s.ok}/${s.n}` : ""}</button>` : `<span class="nc">위치 미연결${s.why ? " — " + esc(s.why) : ""}</span>`;
    return `<div class="it${act ? " act" : ""}${ok ? "" : " off"}" id="v-${esc(it.id)}" data-id="${esc(it.id)}">` +
      `<span class="no" style="background:${tone(it)}">${i + 1}</span>` +
      `<div class="r1"><span class="idc">${esc(it.id)}</span>${N.badge(it.status)}<span class="tl">${esc(it.title)}</span></div>` +
      `<p class="sm2">${N.inline(it.summary, { links: false })}</p>` +
      `<div class="ac">${loc}<a class="b sm" href="index.html#${encodeURIComponent(it.id)}" target="_blank" rel="noopener">기획노트에서 열기 ↗</a></div>` +
      `<span class="why">현재 권한에서 안 보이는 기능 — ${esc([...(it.perm || []).map((p) => "권한 " + p), ...[].concat(it.svc || []).map((s) => "서비스 " + s)].join(" · "))}</span></div>`;
  }
  function paint() {
    head();
    if (V.err) return;
    const { A, T } = lists();
    V.items = T[V.tab];
    tabs(T);
    $("#fabn").textContent = A.length;
    $("#list").innerHTML = V.items.length ? V.items.map(item).join("") : `<div class="empty">${V.ctx && V.ctx.auth ? "로그인 화면에는 기획 노트가 없습니다" : "이 화면에 연결된 항목이 없습니다"}</div>`;
    draw();
  }
  /* 하이라이트 · 칩 */
  function draw() {
    if (!br.ready()) return;
    const L = V.items;
    br.chips(V.chip ? L.flatMap((it, i) => hlList(it, i + 1)) : []);
    const a = L.findIndex((x) => x.id === V.act);
    if (a < 0) { V.act = null; br.show([]); } else br.show(hlList(L[a], a + 1));
  }
  function locate(id, scroll) {
    const i = V.items.findIndex((x) => x.id === id); if (i < 0) return 0;
    V.act = id; paint();
    const n = br.show(hlList(V.items[i], i + 1), { scroll });
    const el = document.getElementById("v-" + id); if (el) el.scrollIntoView({ block: "nearest" });
    return n;
  }

  /* 브리지 */
  const ERR = {
    file: "<b>file://로 열었습니다.</b><br>프로토타입과 같은 출처가 필요해 연결할 수 없습니다. GitHub Pages 주소로 열거나 저장소 폴더에서 <code>python3 -m http.server</code> 실행 뒤 <code>http://localhost:8000/note/viewer.html</code>로 여세요.",
    "cross-origin": "<b>다른 출처의 프로토타입입니다.</b><br>viewer.html과 supplier_v5_0.html이 같은 서버 · 같은 경로 기준에 있어야 합니다.",
    "not-ready": "<b>프로토타입을 불러오지 못했습니다.</b><br>경로(<code>" + esc(N.meta.proto) + "</code>)를 확인하세요.",
  };
  const br = NoteBridge.attach($("#pv"), {
    onReady() { $("#bst").textContent = "프로토타입 연결됨"; if (V.deep.scr) { const c = br.ctx(); if (c.cur !== V.deep.scr) br.go(V.deep.scr); } },
    onChange(kind, c) {
      const moved = !V.ctx || V.ctx.cur !== c.cur;
      V.ctx = c;
      if (moved) { V.act = null; history.replaceState(null, "", "?scr=" + encodeURIComponent(c.cur)); }
      if (V.deep.hl && c.cur === (V.deep.scr || c.cur)) {
        const it = N.byId[V.deep.hl]; V.deep.hl = null;
        if (it) { V.tab = N.vtabOf(it); document.body.classList.add("open"); paint(); locate(it.id, true); return; }
      }
      if (kind === "screen") paint(); else refreshLoc();
    },
    onError(k) { V.err = k; $("#bst").textContent = "연결 안 됨"; head(); $("#tabs").innerHTML = ""; $("#list").innerHTML = `<div class="err">${ERR[k] || esc(k)}</div>`; },
  });
  /* 같은 화면 안 부분 갱신 — 위치 보기 버튼 상태만 다시 */
  let rt = 0;
  function refreshLoc() { clearTimeout(rt); rt = setTimeout(() => { if (!V.err) { const y = $("#list").scrollTop; paint(); $("#list").scrollTop = y; } }, 120); }
  $("#pv").src = N.meta.proto;

  /* 조작 */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-tab],[data-loc],#chip,#close,#fab");
    if (!t) return;
    if (t.dataset.tab) { V.tab = t.dataset.tab; V.act = null; paint(); $("#list").scrollTop = 0; }
    else if (t.dataset.loc) { const id = t.dataset.loc; if (V.act === id) { V.act = null; paint(); } else locate(id, true); }
    else if (t.id === "chip") { V.chip = !V.chip; t.setAttribute("aria-pressed", String(V.chip)); t.classList.toggle("on", V.chip); draw(); }
    else if (t.id === "close") { document.body.classList.remove("open"); N.store.set("vopen", false); }
    else if (t.id === "fab") { document.body.classList.add("open"); N.store.set("vopen", true); paint(); }
  });
  /* 폭 조절 360 ~ 520 */
  const grip = $("#grip");
  const setW = (w) => { w = Math.round(Math.min(520, Math.max(360, w))); document.body.style.setProperty("--w", w + "px"); N.store.set("vw", w); };
  grip.addEventListener("pointerdown", (e) => {
    e.preventDefault(); grip.setPointerCapture(e.pointerId); document.body.classList.add("drag");
    const mv = (ev) => setW(window.innerWidth - ev.clientX);
    const up = () => { document.body.classList.remove("drag"); grip.removeEventListener("pointermove", mv); grip.removeEventListener("pointerup", up); };
    grip.addEventListener("pointermove", mv); grip.addEventListener("pointerup", up);
  });
  grip.addEventListener("keydown", (e) => { const w = parseInt(getComputedStyle(document.body).getPropertyValue("--w")) || 400; if (e.key === "ArrowLeft") setW(w + 20); if (e.key === "ArrowRight") setW(w - 20); });

  window.__viewer = { V, br, paint, locate }; /* 검증용 */
})(window.NOTE);
</script>
</body>
</html>

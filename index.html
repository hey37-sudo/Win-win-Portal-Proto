<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공급사Portal 기획노트</title>
<link rel="stylesheet" href="note.css">
<style>
  .top { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--line); }
  .top .row { display: flex; align-items: center; gap: 18px; height: 52px; padding: 0 20px; }
  .top .row + .row { height: 42px; padding: 0 12px; border-top: 1px solid var(--line2); }
  .brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .brand b { font-size: 15px; letter-spacing: -.2px; }
  .brand b::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 7px; border-radius: 2px; background: var(--pt); vertical-align: 1px; }
  .brand span { font-size: 11.5px; color: var(--mut); }
  .gnb { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .gnb button { height: 42px; padding: 0 10px; border: 0; border-bottom: 2px solid transparent; background: none; font-size: 13px; color: var(--sub); white-space: nowrap; }
  .gnb button:hover { color: var(--tx); }
  .gnb button[aria-current="true"] { color: var(--tx); font-weight: 700; border-bottom-color: var(--pt); }
  .gnb button i { font-style: normal; font-size: 11px; color: var(--mut); margin-right: 4px; }
  .tr { display: flex; align-items: center; gap: 8px; }
  .q { position: relative; display: block; }
  .q input { width: 320px; height: 32px; padding: 0 30px 0 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); font: inherit; }
  .q input:focus { background: #fff; border-color: var(--pt); outline: none; }
  .q kbd { position: absolute; right: 8px; top: 7px; height: 18px; padding: 0 5px; border: 1px solid var(--line); border-radius: 3px; font: 11px/16px var(--mono); color: var(--mut); background: #fff; }
  .tr { margin-left: auto; }
  .wrap { display: flex; align-items: flex-start; min-height: calc(100vh - 95px); }
  .snb { position: sticky; top: 95px; flex: 0 0 216px; height: calc(100vh - 95px); overflow-y: auto; padding: 14px 10px; border-right: 1px solid var(--line); background: #fbfbfc; }
  .snb h2 { margin: 2px 8px 8px; font-size: 12px; color: var(--mut); font-weight: 600; }
  .snb button { display: flex; align-items: center; justify-content: space-between; width: 100%; height: 32px; padding: 0 10px; border: 0; border-radius: var(--r); background: none; text-align: left; font-size: 13px; color: var(--sub); }
  .snb button:hover { background: var(--hover); color: var(--tx); }
  .snb button[aria-current="true"] { background: var(--pt-bg); color: var(--pt-d); font-weight: 700; }
  .snb button em { font-style: normal; font-size: 11px; color: var(--mut); }
  .snb button.pg::after { content: "계산"; font-size: 10px; color: var(--mut); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; line-height: 14px; }
  main { flex: 1; min-width: 0; padding: 20px 28px 80px; max-width: 1180px; }
  .ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .ph h1 { margin: 0; font-size: 19px; letter-spacing: -.3px; }
  .ph .loc { font-size: 12px; color: var(--mut); margin-bottom: 2px; }
  .ph .n { font-size: 12px; color: var(--sub); }
  .flt { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 12px; margin-bottom: 14px; background: #fff; border: 1px solid var(--line); border-radius: var(--r); }
  .flt .g { display: flex; align-items: center; gap: 6px; }
  .flt .g > span { font-size: 12px; color: var(--mut); margin-right: 2px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .seg button { height: 26px; padding: 0 9px; border: 0; border-left: 1px solid var(--line); background: #fff; font-size: 12px; color: var(--sub); }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--pt-bg); color: var(--pt-d); font-weight: 700; }
  .flt .x { margin-left: auto; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); margin-bottom: 10px; scroll-margin-top: 112px; }
  .card.flash { animation: fl 1.6s ease-out; }
  @keyframes fl { 0%, 30% { box-shadow: 0 0 0 3px rgba(16, 158, 190, .45); } 100% { box-shadow: var(--sh); } }
  .ch { padding: 12px 14px 10px; cursor: pointer; border-radius: var(--r); }
  .ch:hover { background: #fcfcfd; }
  .r1 { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .r1 .tl { font-size: 14px; font-weight: 700; letter-spacing: -.2px; }
  .r1 .ty { font-size: 11px; color: var(--mut); }
  .r1 .sp { flex: 1; }
  .r1 .tg { display: flex; gap: 4px; align-items: center; }
  .sm2 { margin: 5px 0 0; color: var(--sub); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card.open .sm2 { -webkit-line-clamp: unset; display: block; }
  .r3 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .r3 .refs { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; flex: 1; min-width: 0; }
  .r3 .refs > span { font-size: 11px; color: var(--mut); margin-right: 2px; }
  .r3 .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .cb { display: none; padding: 4px 14px 14px; border-top: 1px dashed var(--line); }
  .card.open .cb { display: block; }
  .cb > .bd { padding-top: 6px; }
  .tpl h4 { margin: 12px 0 2px; font-size: 12.5px; color: var(--pt-d); }
  dl.meta { display: grid; grid-template-columns: 76px 1fr; gap: 4px 10px; margin: 12px 0 0; padding: 10px 12px; background: #fafbfc; border: 1px solid var(--line2); border-radius: var(--r); font-size: 12px; }
  dl.meta dt { color: var(--mut); }
  dl.meta dd { margin: 0; color: var(--sub); }
  dl.meta dd ul { margin: 0; padding-left: 16px; }
  .anc { font: 11.5px var(--mono); color: var(--sub); }
  .empty { padding: 36px; text-align: center; color: var(--mut); background: #fff; border: 1px dashed var(--line); border-radius: var(--r); }
  .sr { display: block; padding: 10px 14px; margin-bottom: 8px; background: #fff; border: 1px solid var(--line); border-radius: var(--r); color: inherit; }
  .sr:hover { border-color: #c9ced6; text-decoration: none; }
  .sr .lc { font-size: 11.5px; color: var(--mut); }
  .sr .r1 .tl { font-size: 13.5px; }
  .sr .sn { margin-top: 3px; font-size: 12px; color: var(--sub); }
  .tbl { width: 100%; border-collapse: collapse; background: #fff; font-size: 12.5px; }
  .tbl th, .tbl td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; vertical-align: top; }
  .tbl th { background: #f8f9fb; color: var(--sub); font-weight: 600; white-space: nowrap; }
  .tbl td.c, .tbl th.c { text-align: center; }
  .tbl td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .tbl tr.sub td { background: #fafbfc; color: var(--mut); font-size: 12px; }
  .sec { margin: 22px 0 8px; font-size: 14px; }
  .note { padding: 10px 12px; background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--pt); border-radius: var(--r); color: var(--sub); margin-bottom: 14px; }
  .hist { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; }
  .hist .ids { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
  @media (max-width: 900px) { .snb { display: none; } .q input { width: 160px; } main { padding: 16px; } }
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div class="brand"><b>기획노트</b><span id="ver"></span></div>
    <div class="tr">
      <label class="q"><input id="q" type="search" placeholder="검색 — 제목 · 요약 · 본문 · ID" aria-label="기획노트 검색" autocomplete="off"><kbd>/</kbd></label>
      <a class="b pri" href="viewer.html" target="_blank" rel="noopener">프로토타입 + 기획 패널 ↗</a>
    </div>
  </div>
  <div class="row"><nav class="gnb" id="gnb" aria-label="기획노트 대메뉴"></nav></div>
</header>
<div class="wrap">
  <aside class="snb" id="snb" aria-label="기획노트 메뉴"></aside>
  <main id="main"></main>
</div>

<script src="data/meta.js"></script>
<script src="data/proto-menu.js"></script>
<script src="data/policy.js"></script>
<script src="data/screen.js"></script>
<script src="data/req.js"></script>
<script src="data/scenario.js"></script>
<script src="data/process.js"></script>
<script src="data/history.js"></script>
<script src="core.js"></script>
<script>
(function (N) {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s), esc = N.esc, M = N.meta;
  const S = { g: "intro", s: "guide", q: "", open: new Set(), f: Object.assign({ site: "*", st: "*", own: "*" }, N.store.get("flt", {})) };
  $("#ver").textContent = `${M.title.replace("기획노트", "").trim()} · v${M.ver} · ${M.updated}`;

  /* 정렬: 화면 = 프로토타입 MENU 순서, 나머지 = ID */
  const ORDER = {}; Object.keys(N.scrIndex).forEach((id, i) => (ORDER["SCR-" + id] = i));
  const byOrder = (a, b) => (a.id in ORDER && b.id in ORDER ? ORDER[a.id] - ORDER[b.id] : a.id.localeCompare(b.id, "ko", { numeric: true }));
  const itemsAt = (g, s) => N.all().filter((x) => x.gnb === g && x.snb === s);
  const shown = (L) => L.filter((x) => N.pass(x, S.f)).sort(byOrder);

  /* ── GNB · SNB ── */
  function gnb() {
    $("#gnb").innerHTML = M.menu.map((g, i) => `<button type="button" data-g="${g.k}" aria-current="${!S.q && S.g === g.k}"><i>${i + 1}</i>${esc(g.lb)}</button>`).join("");
  }
  function snb() {
    const G = N.gnb(S.g);
    $("#snb").innerHTML = `<h2>${esc(G.lb)}</h2>` + G.snb.map((s) => {
      const n = s.page ? "" : shown(itemsAt(G.k, s.k)).length;
      return `<button type="button" class="${s.page ? "pg" : ""}" data-s="${s.k}" aria-current="${!S.q && S.s === s.k}"><span>${esc(s.lb)}</span>${s.page ? "" : `<em>${n || ""}</em>`}</button>`;
    }).join("");
  }

  /* ── 필터 ── */
  const SEG = (k, lb, opts) => `<div class="g"><span>${lb}</span><div class="seg" role="group" aria-label="${lb}">` +
    opts.map(([v, t]) => `<button type="button" data-f="${k}" data-v="${esc(v)}" aria-pressed="${S.f[k] === v}">${esc(t)}</button>`).join("") + "</div></div>";
  const fltH = () => `<div class="flt">` +
    SEG("site", "사이트", [["*", "모두"]].concat(M.sites.map((s) => [s.k, s.k === "ALL" ? "ALL" : s.k === "DIST" ? "유통사" : s.k === "SUP" ? "공급사" : "PA"]))) +
    SEG("st", "상태", [["*", "모두"]].concat(M.status.map((s) => [s.k, s.k]))) +
    SEG("own", "담당", [["*", "모두"]].concat(M.owner.map((o) => [o.k, o.k]))) +
    (S.f.site !== "*" || S.f.st !== "*" || S.f.own !== "*" ? `<button type="button" class="b sm x" data-reset>필터 지우기</button>` : "") + "</div>";

  /* ── 카드 ── */
  const viewerUrl = (scr, id) => `viewer.html?scr=${encodeURIComponent(scr)}&hl=${encodeURIComponent(id)}`;
  function card(it) {
    const open = S.open.has(it.id);
    const refs = (it.refs || []).map((r) => N.idChip(r)).join("");
    const acts = (it.scr || []).map((s) => `<a class="b sm" href="${viewerUrl(s, it.id)}" target="_blank" rel="noopener" title="프로토타입 ${esc(N.scrLb(s))} 화면에서 위치 보기">프로토타입에서 보기 · ${esc(N.scrLb(s))} ↗</a>`).join("");
    const anc = (it.anchor || []).map((a) => `<li class="anc">${esc(a.scr)} · ${esc(a.area ? N.meta.areas.find((x) => x.k === a.area).lb : "—")}${a.text ? ` · "${esc(a.text)}"` : ""}${a.popup ? " · 팝업" : ""}</li>`).join("");
    const lst = (L) => (L && L.length ? L.map(esc).join(", ") : "—");
    return `<article class="card${open ? " open" : ""}" id="c-${esc(it.id)}" data-id="${esc(it.id)}">` +
      `<div class="ch" role="button" tabindex="0" aria-expanded="${open}" data-tog="${esc(it.id)}">` +
      `<div class="r1">${N.idChip(it.id, false)}${N.badge(it.status)}<span class="tl">${esc(it.title)}</span><span class="ty">${esc(N.typeLb(it.type))}</span><span class="sp"></span><span class="tg">${N.sites(it)}${N.ownerTag(it.owner)}</span></div>` +
      `<p class="sm2">${N.inline(it.summary)}</p>` +
      `<div class="r3"><div class="refs">${refs ? `<span>관련</span>${refs}` : ""}</div><div class="acts">${acts}</div></div></div>` +
      `<div class="cb"><div class="bd">${it.tpl ? N.tplHtml(it.tpl) : ""}${it.body ? N.md(it.body) : ""}</div>` +
      `<dl class="meta"><dt>위치</dt><dd>${esc(N.loc(it))}</dd>` +
      `<dt>화면</dt><dd>${(it.scr || []).map((s) => `${esc(N.scrLb(s))} <code>${esc(s)}</code>`).join(" · ") || "—"}</dd>` +
      `<dt>앵커</dt><dd>${anc ? `<ul>${anc}</ul>` : "—"}</dd>` +
      `<dt>권한</dt><dd>${lst(it.perm)}</dd><dt>서비스</dt><dd>${lst([].concat(it.svc || []))}</dd>` +
      `<dt>출처</dt><dd><ul>${(it.src || []).map((x) => `<li>${N.inline(x)}</li>`).join("")}</ul></dd>` +
      `<dt>갱신</dt><dd>${esc(it.updated)} · v${esc(it.ver)}</dd></dl></div></article>`;
  }

  /* ── 계산 화면 ── */
  const PAGES = {
    history() {
      return (N.history || []).map((h) => `<div class="hist"><div class="r1"><span class="tl">v${esc(h.ver)}</span><span class="mut">${esc(h.date)}</span><b>${esc(h.title)}</b><span class="sp"></span><span class="mut">프로토타입 ${esc(h.proto || "")}</span></div>` +
        `<p class="md">${N.inline(h.note || "")}</p><div class="ids">${(h.items || []).map((id) => N.idChip(id)).join("")}</div></div>`).join("") || `<div class="empty">기록 없음</div>`;
    },
    guide() {
      const T = (hd, rows) => `<table class="tbl"><thead><tr>${hd.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
      return `<div class="note">화면에서 눈으로 보이는 것(배치 · 열 순서 · 버튼 모양)은 프로토타입이 원본입니다. 기획노트에는 보이지 않는 규칙 — 조건 · 계산식 · 상태 전이 · 권한/데이터 범위 · 유효성 · 예외 · 연동 · 미결 — 만 적습니다.</div>` +
        `<h3 class="sec">ID 접두어</h3>` + T(["접두어", "종류", "뜻"], M.types.map((t) => [`<code>${t.k}-</code>`, esc(t.lb), esc(t.d)])) +
        `<h3 class="sec">상태</h3>` + T(["상태", "뜻"], M.status.map((s) => [N.badge(s.k), esc(s.d)])) +
        `<h3 class="sec">사이트 태그</h3>` + T(["태그", "범위"], M.sites.map((s) => [`<span class="site s-${s.k}">${esc(s.lb)}</span> <code>${s.k}</code>`, esc(s.d)])) +
        `<p class="md mut">사이트 필터에서 PA · 유통사 · 공급사를 고르면 ALL 항목도 함께 보입니다.</p>` +
        `<h3 class="sec">담당</h3>` + T(["담당", "뜻"], M.owner.map((o) => [N.ownerTag(o.k), esc(o.d)])) +
        `<h3 class="sec">본문 표기</h3>` + T(["표기", "뜻"], [[`<span class="mk mk-tbd">TBD …</span> <span class="mk mk-tbd">확인 …</span>`, "자료에 없거나 가정값 — 뒤에 근거 ID · 회의 시각"], [`<span class="mk mk-hy">협의 B-nn</span>`, "공통정책서 부록 B 협의 항목"], [`<span class="mk mk-bo">보류 B-nn</span>`, "다른 결정을 기다림"], ["<code>MSG-FR-901</code> 등", "프로토타입 메시지 코드 (문구 원본은 프로토타입)"]]) +
        `<h3 class="sec">프로토타입 연결</h3>` + T(["필드 · 기능", "규칙"], [
          ["<code>scr</code>", "프로토타입 MENU id와 정확히 같아야 함 (화면 목록 참고)"],
          ["<code>anchor</code>", "{scr, area, text, popup} — area: " + M.areas.map((a) => `<code>${a.k}</code> ${esc(a.lb)}`).join(" · ") + ". text는 버튼 · 표 머리 · 라벨 글자와 정확히 일치 (공백 정리, 끝의 필수 표시 * 무시)"],
          ["<code>perm</code> · <code>svc</code>", "프로토타입 컨트롤러 키. perm은 하나라도 있으면, svc는 모두 켜져 있어야 보임 — 아니면 패널에서 흐리게"],
          ["딥링크", "<code>index.html#REQ-052</code> 항목 열기 · <code>viewer.html?scr=dv.asn&amp;hl=REQ-052</code> 화면 열고 위치 표시"],
          ["단축키", "<kbd>/</kbd> 검색 · <kbd>Esc</kbd> 검색 지우기"],
          ["뷰어", "같은 출처에서만 동작 — GitHub Pages 또는 <code>python3 -m http.server</code>. file://로 열면 연결 안 됨"],
        ]);
    },
    screens() {
      const by = {}; N.screen.forEach((x) => (by[x.id.slice(4)] = x));
      const rel = {}; N.all().forEach((x) => (x.scr || []).forEach((s) => (rel[s] = (rel[s] || 0) + 1)));
      let n = 0, done = 0;
      const rows = (N.protoMenu || []).filter((t) => !t.home).map((t) => t.secs.map((s) => s.items.map((it) => {
        n++; const d = by[it.id]; if (d) done++;
        const cond = [it.perm.length ? "권한 " + it.perm.join("·") : "", it.svc ? "서비스 " + it.svc : ""].filter(Boolean).join(" / ");
        return `<tr><td>${esc(t.lb)}</td><td>${esc(s.lb)}</td><td><b>${esc(it.lb)}</b></td><td><code>${esc(it.id)}</code></td><td>${esc(cond) || "<span class='mut'>—</span>"}</td>` +
          `<td>${d ? `${N.badge(d.status)} <a href="#${encodeURIComponent(d.id)}">${esc(d.id)}</a>` : "<span class='mut'>3단계</span>"}</td><td class="n">${rel[it.id] || ""}</td>` +
          `<td class="c"><a class="b sm" href="viewer.html?scr=${encodeURIComponent(it.id)}" target="_blank" rel="noopener">열기 ↗</a></td></tr>`;
      }).join("")).join("")).join("");
      return `<div class="note">프로토타입 MENU에서 자동으로 만든 목록입니다 (<code>tests/sync-menu.mjs</code>). 화면 디스크립션 ${done} / ${n}. 로그인 · 회원가입은 MENU 밖 화면이라 3단계에서 따로 둡니다.</div>` +
        `<table class="tbl"><thead><tr><th>대메뉴</th><th>묶음</th><th>메뉴</th><th>MENU id</th><th>노출 조건</th><th>디스크립션</th><th>관련</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
    },
    summary() {
      const A = N.all().filter((x) => N.pass(x, S.f)), ST = M.status.map((s) => s.k);
      const row = (lb, L) => `<tr><td>${lb}</td>${ST.map((s) => `<td class="n">${L.filter((x) => x.status === s).length || ""}</td>`).join("")}<td class="n"><b>${L.length}</b></td></tr>`;
      const tb = (hd, rows) => `<table class="tbl"><thead><tr><th>${hd}</th>${ST.map((s) => `<th class="c">${N.badge(s)}</th>`).join("")}<th class="c">계</th></tr></thead><tbody>${rows}</tbody></table>`;
      return fltH() + `<h3 class="sec">종류 × 상태</h3>` + tb("종류", M.types.map((t) => row(`<code>${t.k}</code> ${esc(t.lb)}`, A.filter((x) => x.type === t.k))).join("") + row("<b>전체</b>", A)) +
        `<h3 class="sec">사이트 × 상태</h3>` + tb("사이트", M.sites.map((s) => row(esc(s.lb), A.filter((x) => (x.site || []).includes(s.k)))).join("")) +
        `<h3 class="sec">담당 × 상태</h3>` + tb("담당", M.owner.map((o) => row(esc(o.k), A.filter((x) => x.owner === o.k))).join(""));
    },
    tracker() {
      const A = N.all(), B = {};
      A.forEach((it) => N.text(it).replace(/〔(협의|보류|확인|TBD)\s*([^〕]*)〕/g, (m, k, t) => { (t.match(/B-\d{2}/g) || []).forEach((b) => { (B[b] = B[b] || { k, ids: new Set() }).ids.add(it.id); }); return m; }));
      const L = Object.keys(B).sort();
      const com = A.filter((x) => x.owner === "공통 제공" && N.pass(x, S.f)).sort(byOrder);
      return `<div class="note">공통정책서 부록 B 협의 번호(B-nn)가 걸린 항목과, 담당이 '공통 제공'인 항목을 모아 봅니다.</div>` +
        `<h3 class="sec">협의 번호별</h3><table class="tbl"><thead><tr><th>번호</th><th>표기</th><th>걸린 항목</th></tr></thead><tbody>` +
        (L.map((b) => `<tr><td><code>${b}</code></td><td><span class="mk mk-${/^(TBD|확인)/.test(B[b].k) ? "tbd" : B[b].k === "보류" ? "bo" : "hy"}">${B[b].k}</span></td><td>${[...B[b].ids].map((id) => N.idChip(id)).join(" ")}</td></tr>`).join("") || `<tr><td colspan="3" class="c mut">없음</td></tr>`) + `</tbody></table>` +
        `<h3 class="sec">공통 제공 항목</h3>` + (com.map(card).join("") || `<div class="empty">없음</div>`);
    },
    decisions() {
      const A = N.all(), R = [];
      A.forEach((it) => {
        if (it.status === "TBD") R.push([it.id, "항목 전체", it.summary]);
        (it.tpl && it.tpl.open || []).forEach((r) => R.push([it.id, "미결", r[0] + " — " + r[1]]));
        N.text(it).split(/\n| - |\|/).forEach((ln) => { if (/〔(TBD|확인)/.test(ln)) R.push([it.id, "TBD 표기", ln.replace(/^[-\s]+/, "").trim()]); });
      });
      const dec = (N.dec || []).filter((x) => N.pass(x, S.f));
      const seen = new Set(), rows = R.filter((r) => { const k = r.join("|"); if (seen.has(k)) return false; seen.add(k); return true; });
      return `<div class="note">결정(DEC) 항목과, 상태 TBD · 화면 디스크립션 '미결' · 본문 〔TBD〕 표기를 모아 봅니다. 결정이 나면 DEC 항목으로 남기고 원래 항목 상태를 바꿉니다.</div>` +
        `<h3 class="sec">결정 로그</h3>` + (dec.map(card).join("") || `<div class="empty">아직 결정 항목이 없습니다</div>`) +
        `<h3 class="sec">미결 · TBD ${rows.length}건</h3><table class="tbl"><thead><tr><th>항목</th><th>구분</th><th>내용</th></tr></thead><tbody>` +
        rows.map((r) => `<tr><td>${N.idChip(r[0])}</td><td>${r[1]}</td><td>${N.inline(r[2])}</td></tr>`).join("") + `</tbody></table>`;
    },
  };

  /* ── 본문 ── */
  function page() {
    const G = N.gnb(S.g), SB = N.snb(S.g, S.s) || G.snb[0];
    let h = `<div class="ph"><div><div class="loc">${esc(G.lb)}</div><h1>${esc(SB.lb)}</h1></div>`;
    if (SB.page) return h + `</div>` + PAGES[SB.page]();
    const all = itemsAt(G.k, SB.k), L = shown(all);
    h += `<div class="n">${L.length}${L.length !== all.length ? ` / ${all.length}` : ""}건</div></div>` + fltH();
    return h + (L.map(card).join("") || `<div class="empty">${all.length ? "필터에 맞는 항목이 없습니다" : "아직 항목이 없습니다 — 3단계에서 채웁니다"}</div>`);
  }
  /* ── 검색 ── */
  const toks = (q) => q.toLowerCase().split(/\s+/).filter(Boolean);
  function hi(s, T) {
    let h = esc(s);
    T.forEach((t) => { const e = esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); h = h.replace(new RegExp(`(${e})(?![^<]*>)`, "gi"), "<mark>$1</mark>"); });
    return h;
  }
  function search() {
    const T = toks(S.q);
    const R = N.all().filter((it) => N.pass(it, S.f)).filter((it) => { const t = N.text(it).toLowerCase(); return T.every((x) => t.includes(x)); }).sort(byOrder);
    const snip = (it) => {
      const raw = [it.body || "", it.tpl ? Object.values(it.tpl).flat(2).join(" · ") : ""].join(" ");
      const t = raw.replace(/\|[\s:|-]*-{3}[\s:|-]*\|/g, " ").replace(/\s*\|\s*/g, " · ").replace(/(^|\n)\s*-\s+/g, " · ").replace(/\s+/g, " ").replace(/^[\s·]+/, "");
      const lo = t.toLowerCase();
      let i = -1; for (const x of T) { const j = lo.indexOf(x); if (j >= 0) { i = j; break; } }
      if (i < 0) return "";
      const a = Math.max(0, i - 50), b = Math.min(t.length, i + 90);
      return (a ? "…" : "") + hi(t.slice(a, b), T) + (b < t.length ? "…" : "");
    };
    return `<div class="ph"><div><div class="loc">검색</div><h1>"${esc(S.q)}"</h1></div><div class="n">${R.length}건</div></div>` + fltH() +
      (R.map((it) => `<a class="sr" href="#${encodeURIComponent(it.id)}" data-go="${esc(it.id)}"><div class="lc">${esc(N.loc(it))}</div>` +
        `<div class="r1"><span class="idc">${hi(it.id, T)}</span>${N.badge(it.status)}<span class="tl">${hi(it.title, T)}</span></div>` +
        `<div class="sn">${hi(it.summary, T)}</div>${(() => { const s = snip(it); return s ? `<div class="sn mut">${s}</div>` : ""; })()}</a>`).join("") || `<div class="empty">일치하는 항목이 없습니다</div>`);
  }

  function render() {
    gnb(); snb();
    $("#main").innerHTML = S.q ? search() : page();
  }

  /* ── 이동 · 딥링크 ── */
  function goItem(id) {
    const it = N.byId[id]; if (!it) return false;
    S.q = ""; $("#q").value = ""; S.g = it.gnb; S.s = it.snb; S.open.add(id);
    if (!N.pass(it, S.f)) S.f = { site: "*", st: "*", own: "*" };
    render();
    const el = document.getElementById("c-" + id);
    if (el) { el.scrollIntoView({ block: "start" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
    return true;
  }
  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (!h) { render(); return; }
    if (h.startsWith("/")) { const [g, s] = h.slice(1).split("/"); if (N.gnb(g)) { S.g = g; S.s = N.snb(g, s) ? s : N.gnb(g).snb[0].k; } S.q = ""; render(); window.scrollTo(0, 0); return; }
    if (!goItem(h)) render();
  }
  const setHash = (h) => { if (location.hash.slice(1) === h) route(); else location.hash = h; };

  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-g],[data-s],[data-f],[data-reset],[data-tog]");
    if (!t || e.target.closest("a")) return;
    if (t.dataset.g) { const G = N.gnb(t.dataset.g); setHash("/" + G.k + "/" + G.snb[0].k); }
    else if (t.dataset.s) setHash("/" + S.g + "/" + t.dataset.s);
    else if (t.dataset.f) { S.f[t.dataset.f] = t.dataset.v; N.store.set("flt", S.f); render(); }
    else if ("reset" in t.dataset) { S.f = { site: "*", st: "*", own: "*" }; N.store.set("flt", S.f); render(); }
    else if (t.dataset.tog) { const id = t.dataset.tog; S.open.has(id) ? S.open.delete(id) : S.open.add(id); const c = document.getElementById("c-" + id); c.classList.toggle("open"); t.setAttribute("aria-expanded", String(c.classList.contains("open"))); }
  });
  document.addEventListener("keydown", (e) => {
    const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if (e.key === "/" && !inField) { e.preventDefault(); $("#q").focus(); $("#q").select(); }
    else if (e.key === "Escape" && e.target.id === "q") { $("#q").value = ""; S.q = ""; render(); }
    else if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.tog) { e.preventDefault(); e.target.click(); }
  });
  let qt = 0;
  $("#q").addEventListener("input", (e) => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); render(); }, 120); });
  window.addEventListener("hashchange", route);
  route();
  window.__note = { S, render, goItem }; /* 검증용 */
})(window.NOTE);
</script>
</body>
</html>
